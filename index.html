<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesinwaktu Nusantara</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            background-color: #f4f4f4;
            scroll-behavior: smooth;
        }

        section {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Agar gambar mulai dari atas */
            background-color: white;
        }

        .tampilan-img {
            width: 100%;
            max-width: 1200px; /* Batas lebar agar tidak pecah di layar besar */
            height: auto;
            display: block;
        }

        /* Navigasi titik di samping agar tetap bisa berpindah cepat */
        nav {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 100;
        }

        nav a {
            width: 12px;
            height: 12px;
            background: rgba(0,0,0,0.5);
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <nav>
        <a href="#s1"></a>
        <a href="#s2"></a>
        <a href="#s3"></a>
        <a href="#s4"></a>
    </nav>

    <section id="s1">
        <img src="Tampilan_1.png" alt="Halaman 1" class="tampilan-img">
    </section>

    <section id="s2">
        <img src="Tampilan_2.png" alt="Halaman 2" class="tampilan-img">
    </section>

    <section id="s3">
        <img src="Tampilan_3.png" alt="Halaman 3" class="tampilan-img">
    </section>

    <section id="s4">
        <img src="Tampilan_4.png" alt="Halaman 4" class="tampilan-img">
    </section>

</body>
</html>
